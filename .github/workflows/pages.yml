name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-save --no-audit --no-fund jsdom@30.1.2
      - name: Check frontend regressions
        run: node --test tests/workspace.cjs tests/cloud.cjs tests/objectives.cjs tests/offline.cjs tests/interactions.cjs tests/objective-workflow.cjs
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir public
          cp inter-latin.woff2 INTER-LICENSE.txt emoji-data.json index.html preview.html style.css script.js cloud.js offline.js sw.js firebase-config.js public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
